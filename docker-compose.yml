# Local Oracle for development and CI (Oracle Database 23ai Free).
#   docker compose up -d && docker compose logs -f oracle   # wait for "DATABASE IS READY TO USE!"
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: aml-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYSTEM_PASSWORD:-ChangeMe_Sys1}
    volumes:
      - aml-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
volumes:
  aml-oracle-data:
